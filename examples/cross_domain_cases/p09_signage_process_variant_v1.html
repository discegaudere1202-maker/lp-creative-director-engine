</head><body><main class="page"><header class="top"><span>有限会社シーベ</span><span>デザイン / 製作 / 施工</span></header><section class="hero"><div class="copy"><h1><span>見積もりは、</span><span class="accent">条件から。</span></h1><p class="lead">公開価格に加えて、サイズ・仕様・設置場所まで確認。看板づくりを一つの窓口で相談できます。</p></div><div class="equation"><div class="grid"><div class="price">4,158円<br><small>400×300mm</small></div><div class="facts"><div><strong>サイズ</strong><p>既成か、別注か。</p></div><div><strong>仕様</strong><p>素材と加工方法。</p></div><div><strong>設置場所</strong><p>施工条件まで確認。</p></div></div></div></div></section><footer class="close"><p>デザインから施工まで、一社の窓口で相談できます。</p><strong>金額だけでなく、<b>見積もりの理由まで。</b></strong></footer></main></body></html>
