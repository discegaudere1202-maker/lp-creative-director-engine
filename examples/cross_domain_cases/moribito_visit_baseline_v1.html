<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>森人｜Cross-domain validation baseline</title>
<style>
:root{--ink:#272018;--paper:#e8e0d1;--line:#b8ab97;--moss:#4d614e;--wood:#b67d4e}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}
.page{min-height:100vh;padding:30px 42px 28px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.mast{border-top:1px solid var(--ink);padding-top:9px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em}.eyebrow{color:var(--moss)}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:7vw;align-items:center;padding:6vh 0 5vh}.copy{max-width:520px}.kicker{font-size:11px;letter-spacing:.16em;color:var(--moss);margin-bottom:22px}.kicker:before{content:"";display:inline-block;width:28px;border-top:1px solid var(--moss);vertical-align:middle;margin-right:10px}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;font-size:clamp(56px,6vw,92px);line-height:.98;letter-spacing:-.08em;margin:0}h1 span{display:block;white-space:nowrap}h1 .accent{color:var(--moss);margin-left:.5em}.lead{font-size:14px;line-height:2;margin:32px 0 0;max-width:29em}.material{height:100%;min-height:440px;position:relative;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}.slab{width:min(78%,580px);aspect-ratio:1.55;border-radius:48% 8% 42% 11%;background:linear-gradient(115deg,#8b5b3d,#bd895b 45%,#8a593b);box-shadow:inset 0 0 0 1px rgba(39,32,24,.35),18px 20px 0 rgba(77,97,78,.12);transform:rotate(-7deg);position:relative}.slab:after{content:"楠";position:absolute;right:12%;top:17%;font-family:serif;font-size:clamp(80px,10vw,160px);color:rgba(240,224,195,.42)}.grain{position:absolute;inset:12% 8%;border-top:1px solid rgba(242,218,182,.35);border-bottom:1px solid rgba(242,218,182,.25);transform:rotate(-2deg)}.note{position:absolute;left:10%;bottom:10%;font-family:serif;font-size:18px;line-height:1.5}.closing{border-top:1px solid var(--ink);padding-top:16px;display:flex;justify-content:space-between;gap:24px;align-items:baseline}.closing p{margin:0;font-size:11px;line-height:1.7;color:#655e52}.closing strong{font-family:serif;font-size:24px;font-weight:400}.closing b{color:var(--moss);font-weight:400}
@media(max-width:700px){.page{padding:18px 17px 22px;display:block;overflow:visible}.mast{font-size:8px}.hero{display:block;padding:6vh 0 4vh}.kicker{font-size:9px;margin-bottom:16px}h1{font-size:51px;line-height:1}.lead{font-size:12px;line-height:1.85;margin-top:22px}.material{min-height:270px;margin-top:38px;border-left:0;border-top:1px solid var(--line)}.slab{width:87%;}.note{left:3%;bottom:8%;font-size:14px}.closing{display:block;margin-top:28px;padding-top:12px}.closing strong{display:block;margin-top:8px;font-size:20px}}
@media(max-width:340px){h1{font-size:44px}.material{min-height:240px}.closing strong{font-size:18px}}
</style>
</head>
<body><main class="page">
<header class="mast"><span>手作り家具 森人</span><span class="eyebrow">ONE-SLAB / QUIET MATERIAL</span></header>
<section class="hero"><div class="copy"><div class="kicker">見て、触れて、暮らしへ</div><h1><span>香りまで、</span><span class="accent">家具にする。</span></h1><p class="lead">楠の木の香りにこだわる一枚板家具。木目の美しさだけでなく、自然の温もりを暮らしの真ん中へ。</p></div><div class="material" aria-label="楠の一枚板を抽象化した素材表現"><div class="slab"><div class="grain"></div></div><div class="note">一枚板の<br>輪郭を読む。</div></div></section>
<footer class="closing"><p>福岡市早良区石釜／10:30–17:00／月曜定休</p><strong>家具を、<b>選ぶ時間まで。</b></strong></footer>
</main></body></html>
