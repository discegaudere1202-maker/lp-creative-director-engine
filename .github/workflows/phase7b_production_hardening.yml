name: Phase 7B Production Hardening
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase7b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python -m unittest tests/test_phase7.py tests/test_phase7b.py -v
      - run: python scripts/run_phase7b_validation.py --out /tmp/phase7b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7b-production-hardening
          path: /tmp/phase7b
          if-no-files-found: error
