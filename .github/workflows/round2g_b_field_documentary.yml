name: Round 2G-B Field Documentary

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_round2g_b_field_documentary.py"
      - "tests/test_round2g_b_field_documentary.py"
      - "assets/photography/generated/maylynn_paint/round2g/**"
      - ".github/workflows/round2g_b_field_documentary.yml"

permissions:
  contents: read

jobs:
  maylynn-field-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and browser
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Diff check
        run: git diff --check
      - name: Round 2G-B contract tests
        run: pytest -q tests/test_round2g_b_field_documentary.py tests/test_browser_qa_static.py tests/test_browser_smoke.py
      - name: Generate Maylynn engine output and QA package
        env:
          SOURCE_HEAD: ${{ github.sha }}
          ROUND2G_B_OUTPUT_ROOT: artifacts/round2g_b
        run: python scripts/run_round2g_b_field_documentary.py
      - name: Assert Round 2G-B gates
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/round2g_b')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'PASS', summary
          assert summary['source_head'] == os.environ['EXPECTED_HEAD']
          assert summary['machine_technical_ready'] == 'YES'
          assert summary['creative_implementation_complete'] == 'YES'
          assert summary['shun_final_form_review_ready'] == 'YES'
          assert summary['manual_lp_edit'] == 0
          assert summary['nagi_no_mirai'] == 'NOT_STARTED'
          assert summary['watashi_no_daidokoro'] == 'NOT_STARTED'
          assert summary['one_million_yen_gate'] == 'NOT_ASSESSED'
          browser = summary['qa']['browser']
          assert browser['total'] == 9 and browser['pass'] == 9 and browser['fail'] == 0
          assert browser['overflow_max'] == 0 and browser['console_errors'] == 0
          assert browser['page_errors'] == 0 and browser['request_failures'] == 0
          assert summary['creative_delta']['pass_count'] >= 6
          assert summary['perceptual_tests']['status'] == 'PASS'
          assert summary['captures']['total'] == 20
          assert summary['motion']['status'] == 'PASS'
          for mode in ('desktop', 'mobile'):
              motion = summary['motion'][mode]
              assert 30 <= motion['duration_seconds'] <= 60
              assert len(motion['timecodes']) == 9
          assert Path(root / 'motion_review_manifest.json').is_file()
          assert Path(root / 'human_review_html/index.html').is_file()
          print('Round 2G-B gates PASS')
          PY
      - name: Upload Round 2G-B artifact
        uses: actions/upload-artifact@v4
        with:
          name: round2g-b-field-documentary-${{ github.sha }}
          path: artifacts/round2g_b
          if-no-files-found: error
          retention-days: 14
