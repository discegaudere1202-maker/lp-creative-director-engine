name: Issue 51 Runtime Creative Family Selector

on:
  pull_request:
    paths:
      - "src/lp_engine/production_architecture.py"
      - "tests/test_runtime_family_inference.py"
      - "scripts/run_issue51_runtime_selector.py"
      - "artifacts/issue49_riko/**"
      - ".github/workflows/issue51_runtime_selector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: python -m pip install -e . pytest
      - name: Diff whitespace check
        run: git diff --check
      - name: Issue 51 selector tests
        run: python -m pytest -q -p no:cacheprovider tests/test_runtime_family_inference.py tests/test_production_architecture_contract.py
      - name: Existing targeted regression tests
        run: python -m pytest -q -p no:cacheprovider tests/test_browser_qa_static.py tests/test_round3d_regression_immunity.py
      - name: Build selector artifact
        run: python -X utf8 scripts/run_issue51_runtime_selector.py
      - name: Verify selector artifact
        run: test "$(python -c 'import json; print(json.load(open("artifacts/issue51_runtime_selector/selector_validation.json"))["status"])')" = PASS
      - uses: actions/upload-artifact@v4
        with:
          name: issue51-runtime-selector-${{ github.sha }}
          path: artifacts/issue51_runtime_selector/
          if-no-files-found: error
          retention-days: 30
