name: PM-OPS-1 PR Event Realtime Contract

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, converted_to_draft, closed]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pm_ops_pr_event_realtime.yml'
      - 'scripts/run_pm_ops_pr_event_contract.py'
      - 'tests/test_pm_ops_pr_event_contract.py'
      - 'docs/PM_OPS_*'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hydrate PR metadata for lifecycle payloads
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const eventPath = process.env.GITHUB_EVENT_PATH;
            const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
            const pr = event.pull_request || {};
            if (!pr.body && pr.number) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              event.pull_request.body = response.data.body || '';
              fs.writeFileSync(eventPath, JSON.stringify(event));
            }
      - name: Validate PM-OPS event contract
        run: python scripts/run_pm_ops_pr_event_contract.py
      - name: Run PM-OPS regression tests
        run: python -m pip install pytest && pytest -q tests/test_pm_ops_pr_event_contract.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload event evidence
        uses: actions/upload-artifact@v4
        with:
          name: pm-ops-pr-event-realtime-contract
          path: artifacts/pm_ops_pr_event_realtime
      - name: Record implementation result on Issue 5
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## PM-OPS-1 GitHub-side implementation result', '',
              'Status: HOLD — SARAH PM REVIEW PENDING', '',
              'Realtime PR event workflow and linkage contract are present on commit ' + context.sha + '.', '',
              '- Primary trigger: pull_request.ready_for_review',
              '- Secondary triggers: synchronize, converted_to_draft, closed',
              '- Fallback: existing hourly condition watch',
              '- Workflow: .github/workflows/pm_ops_pr_event_realtime.yml',
              '- Contract: scripts/run_pm_ops_pr_event_contract.py',
              '- Tests: tests/test_pm_ops_pr_event_contract.py',
              '- Sarah prompt: docs/PM_OPS_SARAH_WORK_PROMPT.md', '',
              'Deterministic E2E covers Ready for Review, commit update, and close. Live ChatGPT Work delivery remains pending the user one-time GitHub connector/automation approval; no permission or merge action was automated.'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 5, body});
      - name: Record PR lifecycle signal on linked Task Issue
        if: github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || github.event.action == 'synchronize' || github.event.action == 'closed' || github.event.action == 'converted_to_draft')
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/task_issue:\s*(\d+)/i);
            if (!match) { core.setFailed('pm-ops metadata has no task_issue'); return; }
            const issue = Number(match[1]);
            const pr = context.payload.pull_request;
            const runs = await github.rest.actions.listWorkflowRunsForRepo({owner: context.repo.owner, repo: context.repo.repo, head_sha: pr.head.sha, per_page: 50});
            const files = await github.rest.pulls.listFiles({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100});
            const workflowRuns = Array.isArray(runs.data?.workflow_runs) ? runs.data.workflow_runs : [];
            const changedFiles = Array.isArray(files.data) ? files.data : (Array.isArray(files.data?.files) ? files.data.files : []);
            const runLines = workflowRuns.map(r => '- ' + r.id + ': ' + r.name + ' / ' + r.status + ' / ' + (r.conclusion || 'pending')).join('\n') || '- none yet';
            const fileLines = changedFiles.map(f => '- ' + f.filename + ' (' + f.status + ')').join('\n') || '- none';
            const comment = [
              '## Sarah PM Realtime Catch-up Signal', '',
              'Event: pull_request.' + context.payload.action,
              'PR: #' + pr.number + ' — ' + pr.title,
              'Final HEAD: ' + pr.head.sha,
              'Review state: ' + (pr.draft ? 'draft' : pr.merged ? 'merged' : pr.state), '',
              '### Changed files', fileLines, '',
              '### Matching Actions runs', runLines, '',
              'Sarah next step: inspect the PR, linked Task Issue, matching runs/artifacts, and human evidence. Keep HOLD — SARAH PM REVIEW PENDING; this workflow does not merge or declare visual quality.'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, body: comment});
