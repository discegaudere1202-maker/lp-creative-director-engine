name: Issue 106 Current-Industry Visual Asset Library

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lp_engine/visual_asset_library.py"
      - "src/lp_engine/visual_asset_production.py"
      - "data/visual_asset_library/**"
      - "scripts/run_issue106_visual_asset_library.py"
      - "scripts/run_issue106_visual_asset_library_final.py"
      - "tests/test_visual_asset_library.py"
      - ".github/workflows/issue106-visual-asset-library.yml"
      - "src/lp_engine/production_cutover.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-asset-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Contract and regression tests
        run: python -m unittest tests/test_visual_asset_library.py tests/test_production_cutover.py
      - name: Acquire corrected real candidates and generate Production evidence
        run: python scripts/run_issue106_visual_asset_library_final.py --out artifacts/issue106_visual_asset_library
      - name: Upload Issue 106 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue106-current-industry-visual-asset-library
          path: artifacts/issue106_visual_asset_library/
