name: Round 3I-B Nagi Creative Vertical Slice
run-name: Round 3I-B · ${{ github.ref_name }} · ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_round3i_b_nagi_vertical_slice.py"
      - "tests/test_round3i_b_vertical_slice.py"
      - ".github/workflows/round3i_b_nagi_vertical_slice.yml"
permissions:
  contents: read
jobs:
  creative-vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install renderer
        run: |
          python -m pip install -e . pytest pillow playwright
          python -m playwright install --with-deps chromium
      - name: Validate Phase A dependency
        run: python scripts/run_round3i_a_decision_foundation.py
      - name: Build Phase B candidate and captures
        run: python -X utf8 scripts/run_round3i_b_nagi_vertical_slice.py
      - name: Phase B contracts and Round 3D regression
        run: python -m pytest -q -p no:cacheprovider tests/test_round3i_b_vertical_slice.py tests/test_round3i_a_decision_foundation.py tests/test_round3d_regression_immunity.py
      - name: Upload Phase B package
        uses: actions/upload-artifact@v4
        with:
          name: round3i-b-nagi-creative-vertical-slice-${{ github.sha }}
          path: artifacts/round3i_b/
          if-no-files-found: error
          retention-days: 30
