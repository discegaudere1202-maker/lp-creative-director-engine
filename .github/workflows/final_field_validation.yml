name: Final NO_WEB Field Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lp_engine/production_generation.py"
      - "scripts/run_final_field_validation.py"
      - "data/phase6_sales_master_snapshot_v1.json"
      - ".github/workflows/final_field_validation.yml"

permissions:
  contents: read

jobs:
  final-field-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Contract tests
        run: >-
          python -m unittest
          tests.test_production_generation
          tests.test_production_safety_boundary
          tests.test_production_safety_e2e
          tests.test_quality_diagnosis
          tests.test_client_evidence_and_form_causality
      - name: Run baseline and improved field validation
        run: |
          python scripts/run_final_field_validation.py --out artifacts/final-field/baseline --label baseline
          python scripts/run_final_field_validation.py --out artifacts/final-field/improved --label improved
      - name: Upload final field artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-no-web-field-validation
          path: artifacts/final-field
          if-no-files-found: error
