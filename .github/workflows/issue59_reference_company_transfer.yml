name: Issue 59 Reference Company Transfer Validation

on:
  pull_request:
    paths:
      - "src/lp_engine/controlled_transfer.py"
      - "src/lp_engine/controlled_production.py"
      - "src/lp_engine/production_architecture.py"
      - "src/lp_engine/production_generation.py"
      - "tests/test_issue59_reference_transfer.py"
      - "scripts/run_issue59_reference_transfer.py"
      - "data/issue59_reference_companies.json"
      - "data/production_architecture/**"
      - ".github/workflows/issue59_reference_company_transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine and browser tooling
        run: |
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Diff whitespace check
        run: git diff --check
      - name: Issue 59 transfer integration tests
        run: python -m pytest -q -p no:cacheprovider tests/test_issue59_reference_transfer.py
      - name: Issue 51 selector and Issue 53 controlled-production regression
        run: python -m pytest -q -p no:cacheprovider tests/test_runtime_family_inference.py tests/test_issue53_controlled_production.py tests/test_production_architecture_contract.py
      - name: Generic browser and regression QA
        run: python -m pytest -q -p no:cacheprovider tests/test_browser_qa_static.py tests/test_round3d_regression_immunity.py
      - name: Generate Regina and uka 18-width evidence
        run: python -X utf8 scripts/run_issue59_reference_transfer.py
      - name: Verify transfer evidence and cross-company package
        run: |
          test "$(python -c 'import json; print(json.load(open("artifacts/issue59_reference_transfer/summary.json"))["status"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("artifacts/issue59_reference_transfer/summary.json"))["new_screenshot_count"])')" = 18
          test "$(python -c 'import json; print(json.load(open("artifacts/issue59_reference_transfer/screenshot_inventory.json"))["status"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("artifacts/issue59_reference_transfer/cross_company_evidence.json"))["status"])')" = HUMAN_REVIEW_REQUIRED
          test -f artifacts/issue59_reference_transfer/manifest.json
          test -f artifacts/issue59_reference_transfer/manifest.sha256
          test -f artifacts/issue59_reference_transfer/issue59_cross_company_evidence.zip
      - uses: actions/upload-artifact@v4
        with:
          name: issue59-reference-company-transfer-${{ github.sha }}
          path: artifacts/issue59_reference_transfer/
          if-no-files-found: error
          retention-days: 30
