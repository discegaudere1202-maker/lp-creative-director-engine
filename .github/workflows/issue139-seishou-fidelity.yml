name: Issue 139 Seishou Design-to-Code Fidelity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'experiments/design_to_code/seishou/**'
      - '.github/workflows/issue139-seishou-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: experiments/design_to_code/seishou
        run: npm install
      - name: Install Chromium
        working-directory: experiments/design_to_code/seishou
        run: npx playwright install --with-deps chromium
      - name: Capture and compare
        working-directory: experiments/design_to_code/seishou
        run: npm run evidence
      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue139-seishou-header-hero-trust
          path: experiments/design_to_code/seishou/evidence/iteration_01/
          if-no-files-found: error
