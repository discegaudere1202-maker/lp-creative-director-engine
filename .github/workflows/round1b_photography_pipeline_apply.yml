name: Round 1B Photography Pipeline Apply

on:
  push:
    branches: [round-1b-photography-pipeline-20260916]
    paths: [.round1b-trigger]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round-1b-photography-pipeline-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Apply Photography Pipeline integration
        run: python scripts/apply_round1b_photography_patch.py
      - name: Contract and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .round1b-trigger scripts/apply_round1b_photography_patch.py .github/workflows/round1b_photography_pipeline_apply.yml
          git add src/lp_engine/production_generation.py src/lp_engine/photography.py tests/test_photography_pipeline.py tests/test_production_generation.py
          git commit -m "Implement Photography Direction pipeline"
          git push origin HEAD:round-1b-photography-pipeline-20260916
