name: Phase 6 Sales Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Phase 6 contract tests
        run: python -m unittest tests/test_sales_production.py -v
      - name: Run Stage A/B/C
        run: python scripts/run_phase6_sales_production.py --out /tmp/phase6-sales
      - name: Upload Phase 6 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-sales-production
          path: /tmp/phase6-sales
          if-no-files-found: error
