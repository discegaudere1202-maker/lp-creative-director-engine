name: Round 3K Nagi Persuasion Copy Media Final Implementation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_round3k_nagi_persuasion_media.py'
      - 'tests/test_round3k_nagi_persuasion_media.py'
      - '.github/workflows/round3k_nagi_persuasion_media.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright pytest
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run_round3k_nagi_persuasion_media.py
      - run: pytest -q tests/test_round3k_nagi_persuasion_media.py
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: round3k-nagi-persuasion-media-review
          path: artifacts/round3k_nagi_persuasion_media
