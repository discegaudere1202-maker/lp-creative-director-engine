name: Phase 3 Hearing Finalization

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hearing-finalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Run Phase 3 contract tests
        run: >-
          python -m unittest
          tests/test_phase3_finalization.py
          tests/test_hearing.py
          tests/test_production_safety_e2e.py
      - name: Run Hearing / Finalization validation
        run: >-
          python scripts/run_phase3_finalization.py
          --out /tmp/phase3-finalization
      - name: Upload Phase 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-hearing-finalization
          path: /tmp/phase3-finalization
