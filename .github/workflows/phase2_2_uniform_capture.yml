name: Phase 2.2 uniform pilot full-page capture

on:
  push:
    branches: [main]
    paths:
      - "scripts/capture_phase2_2_fullpage.py"
      - "config/phase2_2_fullpage_capture_targets.json"
      - ".github/workflows/phase2_2_uniform_capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-2-fullpage-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and image cropper
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture Gold backfill 15 plus remaining 80 at 1440 and 390
        run: >-
          python scripts/capture_phase2_2_fullpage.py
          --targets config/phase2_2_fullpage_capture_targets.json
          --output artifacts/phase2_2_uniform_capture
      - name: Preserve capture manifest and images for durable archive ingestion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-2-uniform-capture-${{ github.run_id }}
          path: artifacts/phase2_2_uniform_capture
          retention-days: 30
          if-no-files-found: error
