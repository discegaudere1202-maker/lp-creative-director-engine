name: Issue 74 Phase C Visual Composition Correction
on:
  pull_request:
    paths:
      - src/lp_engine/phase_c_visual_composition.py
      - src/lp_engine/phase_c_authorship_correction.py
      - scripts/run_issue74_phase_c.py
      - tests/test_issue74_phase_c_visual_composition.py
      - .github/workflows/issue74_phase_c_visual_composition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-c-visual-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install pytest playwright
      - run: playwright install --with-deps chromium
      - run: git diff --check
      - name: Issue 74 and regressions
        run: pytest -q tests/test_issue74_phase_c_visual_composition.py tests/test_issue71_phase_c_authorship.py tests/test_issue68_phase_c.py tests/test_issue53_controlled_production.py tests/test_issue59_reference_transfer.py
      - name: Generate 72 visual composition screenshots
        run: python scripts/run_issue74_phase_c.py
      - name: Validate evidence and ZIP
        run: python -c "import json,zipfile; from pathlib import Path; r=Path('artifacts/issue74_phase_c_visual_composition'); s=json.loads((r/'summary.json').read_text()); print({'status':s['status'],'reference_count':s['reference_count'],'screenshot_count':s['screenshot_count'],'browser_pass':sum(x['status']=='PASS' for x in s['browser_qa']),'profile_pairwise':s['all_same_family_renderer_profiles_different'],'hero_core_closing_pairwise':s['all_same_family_hero_core_closing_different'],'failed_rows':[x for x in s['browser_qa'] if x['status']!='PASS']}); assert s['status']=='PASS' and s['reference_count']==8 and s['screenshot_count']==72 and len(s['browser_qa'])==72 and all(x['status']=='PASS' for x in s['browser_qa']); assert s['all_same_family_renderer_profiles_different'] is True and s['all_same_family_hero_core_closing_different'] is True; assert zipfile.ZipFile(r/'issue74_phase_c_visual_composition_evidence.zip').testzip() is None"
      - uses: actions/upload-artifact@v4
        with:
          name: issue74-phase-c-visual-composition-${{ github.sha }}
          path: artifacts/issue74_phase_c_visual_composition
          if-no-files-found: error
