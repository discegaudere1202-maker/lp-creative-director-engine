name: Roof Selector Inventory

on:
  push:
    branches:
      - task/roof-universe-58276
    paths:
      - 'scripts/lead_universe/inspect_mlit_trade_selector.py'
      - '.github/workflows/roof_selector_inventory.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/lead_universe/inspect_mlit_trade_selector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roof-selector-inventory
          path: artifacts/roof_selector_inventory/
          if-no-files-found: error
