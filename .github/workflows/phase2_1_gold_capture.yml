name: Phase 2.1 Gold Evidence Capture

on:
  push:
    paths:
      - "scripts/capture_phase2_1_gold.py"
      - "config/creative_mechanism_phase2_1_gold_selection.json"
      - ".github/workflows/phase2_1_gold_capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture selected 20 existing references at 1440 and 390
        run: python scripts/capture_phase2_1_gold.py --output artifacts/phase2_1_gold_capture
      - name: Save temporary evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-1-gold-evidence-temporary
          path: artifacts/phase2_1_gold_capture
          retention-days: 30
