name: Issue 135 D2C browser-only QA

on:
  push:
    branches:
      - task/issue135-browser-visual-diff-20261001
    paths:
      - .github/workflows/issue135-d2c-browser-qa.yml
      - src/lp_engine/d2c/browser_visual_qa.py
      - src/lp_engine/d2c/visual_diff.py
      - src/lp_engine/d2c/engine.py
      - src/lp_engine/d2c/fragment.html.j2
      - src/lp_engine/d2c/hardening.css
      - fixtures/d2c_melt_skin/production_input.json
      - tests/test_d2c_browser_path.py
      - tests/test_d2c_visual_diff.py
      - tests/test_d2c_semantic_linebreak.py
      - docs/research/issue135-browser-visual-diff-harness.md

permissions:
  contents: read

concurrency:
  group: issue135-d2c-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed project and official Chromium
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Unit checks
        run: |
          mkdir -p artifacts/issue135/logs
          python -m unittest discover -s tests -p 'test_d2c_*.py' 2>&1 | tee artifacts/issue135/logs/unit-tests.log
      - name: Build fixed mock fixture and verify semantic revision bytes
        run: |
          python -m lp_engine.d2c.engine fixtures/d2c_melt_skin/production_input.json --out artifacts/issue135/dist | tee artifacts/issue135/logs/build.log
          echo '3990e736ab9908ac07b0d678636d6fcf7cefa13b77aed6ca81d12705f1f1d9cf  artifacts/issue135/dist/index.html' | sha256sum -c -
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('artifacts/issue135')
          inp=pathlib.Path('fixtures/d2c_melt_skin/production_input.json')
          expected='a1b9cef82e2c802923c4388b23439c9177cda21822cb09cc0ec5e4cfcd2a1a1c1'
          assert hashlib.sha256(inp.read_bytes()).hexdigest()==expected
          manifest=json.loads((root/'dist/production_manifest.json').read_text())
          original_assets={
              'assets/about.jpg':'8b15c2a0df3ae13c44bf320e367b3bc6e5737d03ff353c44fcf2a2bab443416d',
              'assets/hero.jpg':'9afd7dafb234f9b6ffed802e7976b6c49fc187e886c2ceedc7cd0fc6969c2a91',
              'assets/message.jpg':'172d5ec79652bf826eca6d8990a83c6b8e47eb54e984e3afb782bbeba7e64ca5',
              'assets/product.jpg':'b59bc013bcc2a909056b4629b625c6c91a5be2ccec8eb086df3506610f0c06dd'}
          assert {asset['path']:asset['sha256'] for asset in manifest['assets']}==original_assets
          for asset in manifest['assets']:
              assert hashlib.sha256((root/'dist'/asset['path']).read_bytes()).hexdigest()==asset['sha256']
          (root/'logs/provenance.json').write_text(json.dumps({'fixture_sha256':expected,'html_sha256':manifest['html_sha256'],
              'before_html_sha256':'f299bc7c041e084e41078dfbfb41ffaa95fa4499373fd0bc714c1ff864bfa9c0',
              'commit':'${{ github.sha }}'},indent=2))
          PY
      - name: Browser-only nine-width measurement
        id: browser
        continue-on-error: true
        run: |
          python -m lp_engine.d2c.browser_visual_qa \
            --dist artifacts/issue135/dist \
            --out artifacts/issue135/evidence 2>&1 | tee artifacts/issue135/logs/browser.log
      - name: Publish scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue135-d2c-browser-${{ github.run_id }}
          path: artifacts/issue135/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce measured browser gate after evidence upload
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/issue135/evidence/browser_qa.json')
          if not p.is_file():
              sys.exit('BROWSER_EVIDENCE_MISSING')
          qa=json.loads(p.read_text())
          widths=qa.get('width_results',{})
          measured=[w for w,r in widths.items() if r.get('status')=='MEASURED']
          headings={w:len(r.get('actual',{}).get('headings',[])) for w,r in widths.items()}
          print(json.dumps({'browser_gate':qa['browser_gate'],'measured_widths':measured,'visual_diff':qa['visual_diff'],'blockers':qa['blockers']}))
          if len(measured)!=9 or qa['browser_gate']!='PASS' or any(n!=16 for n in headings.values()):
              sys.exit('BROWSER_QA_NOT_PASS')
          PY
