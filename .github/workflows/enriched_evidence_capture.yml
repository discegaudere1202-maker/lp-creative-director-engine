name: Enriched Evidence Capture

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/prototypes/*_enriched_v1.html"
      - "examples/prototypes/*_core_v1.html"
      - "config/prototype_enriched_capture_targets_v1.json"
      - "scripts/capture_prototype_frames.py"
      - ".github/workflows/enriched_evidence_capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture enriched candidates
        run: |
          python scripts/capture_prototype_frames.py \
            --config config/prototype_enriched_capture_targets_v1.json \
            --output artifacts/enriched_evidence_capture
      - name: Upload enriched evidence capture
        uses: actions/upload-artifact@v4
        with:
          name: enriched-evidence-capture-v1
          path: artifacts/enriched_evidence_capture
