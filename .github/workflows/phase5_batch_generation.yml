name: Phase 5 Batch Generation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install engine
        run: pip install -e .
      - name: Install Chromium for real browser QA
        run: python -m playwright install --with-deps chromium
      - name: Batch contract tests
        run: python -m unittest tests/test_batch.py -v
      - name: Run Stage A/B/C rehearsal
        run: python scripts/run_phase5_batch.py --out /tmp/phase5-batch
      - name: Upload Phase 5 validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-batch-validation
          path: /tmp/phase5-batch
          if-no-files-found: error
