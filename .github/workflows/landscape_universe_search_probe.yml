name: Landscape Universe MLIT Search Probe

on:
  push:
    branches:
      - task/landscape-universe-24070
    paths:
      - 'scripts/lead_universe/probe_mlit_search.py'
      - '.github/workflows/landscape_universe_search_probe.yml'
  workflow_dispatch:

jobs:
  probe-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Probe MLIT landscape search result
        run: python scripts/lead_universe/probe_mlit_search.py
      - name: Upload result probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-universe-mlit-search-probe
          path: artifacts/landscape_universe_search_probe/
          if-no-files-found: warn
