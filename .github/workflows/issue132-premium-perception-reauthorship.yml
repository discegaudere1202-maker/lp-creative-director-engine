name: Issue 132 Premium Perception Re-authorship R2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lp_engine/**'
      - 'tests/test_issue132_premium_perception_reauthorship.py'
      - 'tests/test_issue129_premium_perception_recovery.py'
      - 'scripts/run_issue132_premium_perception_reauthorship.py'
      - 'scripts/run_issue129_premium_perception_recovery.py'
      - 'scripts/run_issue129_premium_perception_recovery_ci.py'
      - '.github/workflows/issue132-premium-perception-reauthorship.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  premium-perception-reauthorship-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pillow playwright
          python -m playwright install --with-deps chromium

      - name: Download accepted Issue 111 baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/issue111_baseline
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10912860741/zip" \
            -o /tmp/issue111-baseline.zip
          unzip -q /tmp/issue111-baseline.zip -d artifacts/issue111_baseline
          find artifacts/issue111_baseline -path '*/screenshots/SK1/320.png' -print -quit | grep -q .

      - name: Download Shun-rejected Issue 124 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/issue124_shun_rejected
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10929939766/zip" \
            -o /tmp/issue124-rejected.zip
          unzip -q /tmp/issue124-rejected.zip -d artifacts/issue124_shun_rejected
          find artifacts/issue124_shun_rejected -path '*/owner_html_bundle/cases/SK1/index.html' -print -quit | grep -q .

      - name: Download accepted Issue 129 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/issue129_accepted
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10933900961/zip" \
            -o /tmp/issue129-accepted.zip
          unzip -q /tmp/issue129-accepted.zip -d artifacts/issue129_accepted
          find artifacts/issue129_accepted -path '*/owner_html_bundle/cases/SK2/index.html' -print -quit | grep -q .
          find artifacts/issue129_accepted -path '*/screenshots/PI2/1440.png' -print -quit | grep -q .

      - name: Contract and regression tests
        run: |
          python -m unittest \
            tests/test_issue132_premium_perception_reauthorship.py \
            tests/test_issue129_premium_perception_recovery.py \
            tests/test_issue124_whole_page_art_direction.py \
            tests/test_issue121_production_variant_bridge.py \
            tests/test_premium_authorship.py \
            tests/test_issue111_stage_a_sales_sample.py \
            tests/test_issue111_final_policy.py \
            tests/test_visual_asset_library.py \
            tests/test_production_cutover.py

      - name: Generate Issue 132 exact Stage A evidence
        run: |
          python scripts/run_issue132_premium_perception_reauthorship.py \
            --baseline111 artifacts/issue111_baseline \
            --rejected124 artifacts/issue124_shun_rejected \
            --accepted129 artifacts/issue129_accepted \
            --out artifacts/issue132_premium_perception_reauthorship

      - name: Git whitespace check
        if: always()
        run: git diff --check

      - name: Upload Issue 132 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue132-premium-perception-reauthorship
          path: artifacts/issue132_premium_perception_reauthorship/
          if-no-files-found: warn
