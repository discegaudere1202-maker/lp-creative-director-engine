name: Issue 109 Stage A Visual Asset Inventory Completion

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "data/visual_asset_library/providers/pexels_stage_a_completion_issue109_v1.json"
      - "data/visual_asset_library/providers/pexels_stage_a_issue109_corrections_v1.json"
      - "scripts/run_issue109_stage_a_inventory_completion.py"
      - "scripts/run_issue109_stage_a_inventory_completion_final.py"
      - "src/lp_engine/visual_asset_library.py"
      - "src/lp_engine/visual_asset_production.py"
      - "src/lp_engine/production_cutover.py"
      - "tests/test_visual_asset_library.py"
      - ".github/workflows/issue109-stage-a-inventory-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-a-inventory-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Contract and regression tests
        run: python -m unittest tests/test_visual_asset_library.py tests/test_production_cutover.py
      - name: Generate Stage A 62-asset inventory evidence
        run: python scripts/run_issue109_stage_a_inventory_completion_final.py --out artifacts/issue109_stage_a_inventory
      - name: Git whitespace check
        if: always()
        run: git diff --check
      - name: Upload Issue 109 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue109-stage-a-inventory-completion
          path: artifacts/issue109_stage_a_inventory/
          if-no-files-found: warn
