name: NO_WEB Field Validation

on:
  push:
    branches: [phase/no-web-field-validation-20260916]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  field-validation:
    if: ${{ !contains(github.event.head_commit.message, '[field-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run NO_WEB field validation
        run: python scripts/run_no_web_field_validation.py --out /tmp/no-web-field-validation
      - name: Record inspectable baseline outputs
        run: |
          rm -rf artifacts/no_web_field_validation_baseline
          mkdir -p artifacts/no_web_field_validation_baseline/captures
          cp /tmp/no-web-field-validation/baseline_summary.json artifacts/no_web_field_validation_baseline/
          find /tmp/no-web-field-validation -path '*/exact_capture/*.png' -print0 | while IFS= read -r -d '' file; do
            case_dir=$(basename "$(dirname "$(dirname "$file")")")
            shot=$(basename "$file")
            cp "$file" "artifacts/no_web_field_validation_baseline/captures/${case_dir}_${shot}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/no_web_field_validation_baseline
          git commit -m "Record NO_WEB baseline outputs [field-artifacts]"
          git push
      - name: Upload field validation package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-web-field-validation
          path: /tmp/no-web-field-validation
          if-no-files-found: error
