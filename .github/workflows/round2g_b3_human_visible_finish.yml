name: Round 2G-B3 Human-visible Finish Correction

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_round2g_b2_direction_fidelity_motion.py"
      - "src/lp_engine/round2g_fidelity_gates.py"
      - "tests/test_round2g_b3_finish_gates.py"
      - ".github/workflows/round2g_b3_human_visible_finish.yml"

permissions:
  contents: read

jobs:
  maylynn-human-visible-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project, browser and recording tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest playwright
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          playwright install --with-deps chromium
      - name: Diff check
        run: git diff --check
      - name: Round 2G-B3 contract and regression tests
        run: pytest -q tests/test_round2g_b3_finish_gates.py tests/test_round2g_b2_fidelity_gates.py tests/test_round2g_b_field_documentary.py tests/test_browser_qa_static.py tests/test_browser_smoke.py
      - name: Generate corrected Maylynn finish package
        env:
          SOURCE_HEAD: ${{ github.sha }}
          ROUND2G_B2_OUTPUT_ROOT: artifacts/round2g_b3
        run: python scripts/run_round2g_b2_direction_fidelity_motion.py
      - name: Assert Round 2G-B3 human-visible gates
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/round2g_b3')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'PASS', summary
          assert summary['source_head'] == os.environ['EXPECTED_HEAD']
          assert summary['v03_duplicate_copy']['desktop_mobile_duplicate_count'] == 0
          assert summary['qa']['text_collision']['duplicate_count'] == 0
          assert summary['qa']['header_contrast']['status'] == 'PASS'
          assert summary['motion']['recording_evidence']['status'] == 'PASS'
          assert summary['motion']['recording_evidence']['ground_to_drone']['frame_count'] >= 12
          assert summary['motion']['recording_evidence']['craft']['frame_count'] >= 12
          assert summary['qa']['browser']['total'] == 9 and summary['qa']['browser']['pass'] == 9
          assert summary['qa']['browser']['overflow_max'] == 0
          assert summary['qa']['browser']['console_errors'] == 0
          assert summary['qa']['browser']['page_errors'] == 0
          assert summary['qa']['browser']['request_failures'] == 0
          assert summary['captures']['total'] == 16
          assert summary['machine_technical_ready'] == 'YES'
          assert summary['creative_spec_fidelity'] == 'PASS'
          assert summary['motion_reality'] == 'PASS'
          assert summary['shun_final_form_review_ready'] == 'YES'
          assert summary['human_visual_review'] == 'REQUIRED'
          assert summary['manual_lp_edit'] == 0
          assert summary['nagi_no_mirai'] == 'NOT_STARTED'
          assert summary['watashi_no_daidokoro'] == 'NOT_STARTED'
          assert summary['one_million_yen_gate'] == 'NOT_ASSESSED'
          for mode in ('desktop', 'mobile'):
              assert 45 <= summary['motion'][mode]['duration_seconds'] <= 60
          for path in ('motion_evidence/ground_to_drone_recording_contact_sheet.png', 'motion_evidence/craft_recording_contact_sheet.png', 'reports/text_collision_qa.json', 'reports/header_contrast_qa.json', 'human_review_html/index.html'):
              assert (root / path).is_file(), path
          print('Round 2G-B3 gates PASS')
          PY
      - name: Upload Round 2G-B3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: round2g-b3-human-visible-finish-${{ github.sha }}
          path: artifacts/round2g_b3
          if-no-files-found: error
          retention-days: 14
