name: Production QA Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-qa-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Run three-fixture Generation 1 to 2 QA Loop
        run: >-
          python scripts/run_production_qa_loop.py
          examples/production/phase2_fixtures/chikushi_industries_production_input_v1.json
          examples/production/phase2_fixtures/lovst_photo_studio_production_input_v1.json
          examples/production/phase2_fixtures/aoyama_flower_market_production_input_v1.json
          --out /tmp/production-qa-loop
      - name: Check Andy regression
        run: >-
          python scripts/run_production_generation.py
          examples/production/andy_motorcycle/andy_motorcycle_production_input_v1.json
          --out /tmp/andy-regression --generation-id qa-andy-regression --iteration 2
      - name: Upload QA loop artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-loop
          path: /tmp/production-qa-loop
