name: Round 1F-B Browser Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round1e_browser_validation.yml'
      - 'src/lp_engine/browser_qa.py'
      - 'src/lp_engine/production_generation.py'
      - 'src/lp_engine/creative_genome.py'
      - 'src/lp_engine/structural_similarity.py'
      - 'scripts/run_round1f_validation.py'
      - 'scripts/run_round1e_c2_validation.py'
      - 'scripts/preflight_photography_assets.py'
      - 'tests/test_round1e_c2_harness.py'
      - 'tests/test_creative_genome.py'
      - 'tests/test_production_generation.py'
      - 'artifacts/round1e_b/**'
      - 'assets/photography/**'

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Photography preflight
        run: python scripts/preflight_photography_assets.py --output data/photography/photography_asset_preflight_v1.json
      - name: Round 1F-B Engine regeneration, smoke and 27 viewport QA
        continue-on-error: true
        run: python scripts/run_round1f_validation.py
      - name: Related tests
        if: always()
        run: python -m unittest tests.test_creative_genome tests.test_photography_asset_preflight tests.test_photography_pipeline tests.test_production_generation tests.test_pipeline_evidence_safety tests.test_evidence_safety tests.test_evidence_safety_adversarial
      - name: Upload Round 1F-B human review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round1f-human-review-${{ github.sha }}
          path: |
            artifacts/round1f/summary.json
            artifacts/round1f/reports/
            artifacts/round1f/browser_qa/
            artifacts/round1f/human_review/
            artifacts/round1f/*/index.html
            artifacts/round1f/*/creative_genome.json
            artifacts/round1f/*/quality_gate_report.json
            artifacts/round1f/*/safety_replacement_metadata.json
          if-no-files-found: warn
      - name: Final QA gate
        if: always()
        run: python -c "import json,sys; p=json.load(open('artifacts/round1f/summary.json',encoding='utf-8')); print(p); sys.exit(0 if p.get('overall_status') == 'PASS' and p.get('human_review_ready') else 1)"
