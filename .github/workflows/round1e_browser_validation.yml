name: Round 1K-A5 Copy Semantic Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round1e_browser_validation.yml'
      - 'src/lp_engine/browser_qa.py'
      - 'src/lp_engine/production_generation.py'
      - 'src/lp_engine/creative_genome.py'
      - 'src/lp_engine/narrative_architecture.py'
      - 'src/lp_engine/premium_scene.py'
      - 'src/lp_engine/structural_similarity.py'
      - 'scripts/run_round1f_validation.py'
      - 'scripts/run_round1k_a2_validation.py'
      - 'scripts/run_round1k_a4_validation.py'
      - 'scripts/run_round1k_a5_validation.py'
      - 'scripts/run_round1e_c2_validation.py'
      - 'scripts/preflight_photography_assets.py'
      - 'tests/test_round1e_c2_harness.py'
      - 'tests/test_creative_genome.py'
      - 'tests/test_production_generation.py'
      - 'tests/test_premium_scene.py'
      - 'artifacts/round1k_a2/**'
      - 'artifacts/round1k_a3/**'
      - 'artifacts/round1k_a4/**'
      - 'artifacts/round1k_a5/**'
      - 'assets/photography/**'

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Photography preflight
        run: python scripts/preflight_photography_assets.py --output data/photography/photography_asset_preflight_v1.json
      - name: Round 1K-A5 Engine regeneration, semantic copy contracts and 27 viewport QA
        continue-on-error: true
        env:
          ROUND_OUTPUT_ROOT: artifacts/round1k_a5
        run: python scripts/run_round1k_a5_validation.py
      - name: Related tests
        if: always()
        run: python -m unittest tests.test_creative_genome tests.test_photography_asset_preflight tests.test_photography_pipeline tests.test_production_generation tests.test_pipeline_evidence_safety tests.test_evidence_safety tests.test_evidence_safety_adversarial
      - name: Upload Round 1K-A5 semantic copy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round1k-a5-copy-semantic-${{ github.sha }}
          path: |
            artifacts/round1k_a5/summary.json
            artifacts/round1k_a5/diagnostics/
            artifacts/round1k_a5/reports/
            artifacts/round1k_a5/browser_qa/
            artifacts/round1k_a5/technical_captures/
            artifacts/round1k_a5/*/index.html
            artifacts/round1k_a5/*/creative_genome.json
            artifacts/round1k_a5/*/narrative_architecture.json
            artifacts/round1k_a5/*/premium_scene_plan.json
            artifacts/round1k_a5/*/quality_gate_report.json
            artifacts/round1k_a5/*/safety_replacement_metadata.json
          if-no-files-found: warn
      - name: Final QA gate
        if: always()
        run: python -c "import json,sys; p=json.load(open('artifacts/round1k_a5/summary.json',encoding='utf-8')); print(p); sys.exit(0 if p.get('status') == 'PASS' and p.get('round1k_a5_ready') and p.get('qa_pass_count') == 27 and p.get('qa_fail_count') == 0 else 1)"
