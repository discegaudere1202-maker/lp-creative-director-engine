name: Landscape Universe MLIT HTTP Probe

on:
  push:
    branches:
      - task/landscape-universe-24070
    paths:
      - 'scripts/lead_universe/probe_mlit_requests.py'
      - '.github/workflows/landscape_universe_requests_probe.yml'
  workflow_dispatch:

jobs:
  probe-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe MLIT over HTTP
        run: python scripts/lead_universe/probe_mlit_requests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-universe-mlit-http-probe
          path: artifacts/landscape_universe_requests_probe/
