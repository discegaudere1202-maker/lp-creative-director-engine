name: Issue 71 Phase C Authorship Correction
on:
  pull_request:
    paths:
      - src/lp_engine/phase_c_authorship_correction.py
      - scripts/run_issue71_phase_c.py
      - tests/test_issue71_phase_c_authorship.py
      - src/lp_engine/phase_c_expansion.py
      - data/phase_c_reference_companies.json
      - .github/workflows/issue71_phase_c_authorship_correction.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-c-authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install pytest playwright
      - run: playwright install --with-deps chromium
      - run: git diff --check
      - name: Issue 71 and regression tests
        run: pytest -q tests/test_issue71_phase_c_authorship.py tests/test_issue68_phase_c.py tests/test_issue53_controlled_production.py tests/test_issue59_reference_transfer.py
      - name: Generate 72 screenshot evidence
        run: python scripts/run_issue71_phase_c.py
      - name: Validate evidence and archive
        run: python -c "import json,zipfile; from pathlib import Path; r=Path('artifacts/issue71_phase_c_authorship'); s=json.loads((r/'summary.json').read_text()); assert s['status']=='PASS' and s['reference_count']==8 and s['screenshot_count']==72 and len(s['browser_qa'])==72 and all(x['status']=='PASS' for x in s['browser_qa']); assert s['all_same_family_pairs_structurally_different'] is True; assert zipfile.ZipFile(r/'issue71_phase_c_authorship_evidence.zip').testzip() is None"
      - uses: actions/upload-artifact@v4
        with:
          name: issue71-phase-c-authorship-correction-${{ github.sha }}
          path: artifacts/issue71_phase_c_authorship
          if-no-files-found: error
