name: Issue 68 Phase C Expansion
on:
  pull_request:
    paths:
      - data/phase_c_reference_companies.json
      - src/lp_engine/phase_c_expansion.py
      - scripts/run_issue68_phase_c.py
      - tests/test_issue68_phase_c.py
      - src/lp_engine/production_architecture.py
      - src/lp_engine/production_generation.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pip install playwright
      - run: playwright install --with-deps chromium
      - run: git diff --check
      - run: pytest -q tests/test_issue68_phase_c.py tests/test_issue53_controlled_production.py tests/test_issue59_reference_transfer.py
      - run: python scripts/run_issue68_phase_c.py
      - name: Validate summary and archive
        run: |
          python -c "import json,zipfile; from pathlib import Path; r=Path('artifacts/issue68_phase_c'); s=json.loads((r/'summary.json').read_text()); assert s['status']=='PASS' and s['reference_count']==8 and s['new_screenshot_count']>=72 and len(s['browser_qa'])==72 and all(x['status']=='PASS' for x in s['browser_qa']); assert zipfile.ZipFile(r/'issue68_phase_c_evidence.zip').testzip() is None"
      - uses: actions/upload-artifact@v4
        with:
          name: issue68-phase-c-expansion-${{ github.sha }}
          path: artifacts/issue68_phase_c
          if-no-files-found: error
