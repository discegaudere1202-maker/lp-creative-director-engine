name: Round 2H-H Nagi Final Blocker Closure

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_round2h_h_nagi.py"
      - "scripts/run_round2h_h_contract_tests.py"
      - "src/lp_engine/sales_sample_policy.py"
      - "tests/test_round2h_h_nagi.py"
      - "assets/photography/generated/nagi_no_mirai/**"
      - ".github/workflows/round2h_h_nagi_final_blocker_closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-blocker-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and browser
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
      - name: Diff check
        run: git diff --check
      - name: Contract tests
        run: |
          python scripts/run_round2h_h_contract_tests.py
          python -m unittest discover -s tests -p "test_round2h_h_nagi.py"
      - name: Generate final blocker closure package
        run: python scripts/run_round2h_h_nagi.py
      - name: Assert final gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/round2h_h")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          blockers = json.loads((root / "reports/blocker_evidence.json").read_text(encoding="utf-8"))
          assert summary["status"] == "PASS", summary
          assert summary["human_review_ready"] == "YES", summary
          assert blockers["B01_fact_derived_copy_inconsistency"]["contradiction_count"] == 0, blockers
          assert blockers["B02_mobile_fixed_ui_interference"]["header_collision_count"] == 0, blockers
          assert blockers["B02_mobile_fixed_ui_interference"]["sticky_overlap_count"] == 0, blockers
          assert summary["browser_qa"]["pass"] == 9, summary
          assert summary["mobile_composite_qa"]["status"] == "PASS", summary
          assert summary["one_million_yen_gate"] == "NOT_ASSESSED", summary
          print("Round 2H-H final gates: PASS")
          PY
      - name: Upload Round 2H-H artifact
        uses: actions/upload-artifact@v4
        with:
          name: round2h-h-nagi-final-blocker-closure
          path: artifacts/round2h_h
          if-no-files-found: error
          retention-days: 14
