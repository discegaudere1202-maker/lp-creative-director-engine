name: Phase 2.2.1A replacement capture lane

on:
  push:
    branches: ["phase2-2-1a/replacement-capture-lane"]
    paths:
      - "scripts/capture_phase2_2_1a_replacements.py"
      - "scripts/validate_phase2_2_1a_replacement.py"
      - "tests/test_phase2_2_1a_replacement_capture.py"
      - "config/phase2_2_1a_replacement_capture_schema.json"
      - "data/phase2_2_1a_capture_smoke_target.json"
      - "data/phase2_2_1a_replacement_candidates.jsonl"
      - ".github/workflows/phase2_2_1a_replacement_capture.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke uses isolated fixture; approved_batch uses the separately approved JSONL ledger"
        required: true
        type: choice
        options: [smoke, approved_batch]
        default: smoke

permissions:
  contents: read

concurrency:
  group: phase2-2-1a-replacement-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPTURE_MODE: ${{ inputs.mode || 'smoke' }}
      CAPTURE_ARTIFACT_NAME: phase2-2-1a-replacement-evidence-${{ github.run_id }}
      CAPTURE_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 280f655ae8b635f0517db04dfe21dcef83c0ad95
          persist-credentials: false
      - name: Verify reviewed target and immutable input contract
        env:
          APPROVED_TARGET_SHA: 280f655ae8b635f0517db04dfe21dcef83c0ad95
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_TARGET_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          schema = json.loads(Path("config/phase2_2_1a_replacement_capture_schema.json").read_text())
          assert schema["phase2600_allowed"] is False
          assert all(value is False for value in schema["security"].values())
          assert os.environ["CAPTURE_MODE"] in ("smoke", "approved_batch")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Reviewed capture target\n\n")
              summary.write("Target branch: `phase2-2-1a/production-recovery-20260930`\n\n")
              summary.write("Target SHA: `" + os.environ["APPROVED_TARGET_SHA"] + "`\n\n")
              summary.write("Mode: `" + os.environ["CAPTURE_MODE"] + "`\n\n")
              summary.write("Production ledger: `data/phase2_2_1a_replacement_candidates.jsonl`\n\n")
              summary.write("Smoke is isolated; phase2600_allowed=false.\n")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ordinary browser capture dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate isolated smoke or approved same-cell batch
        run: |
          if [ "$CAPTURE_MODE" = "smoke" ]; then
            python scripts/validate_phase2_2_1a_replacement.py --mode smoke --input data/phase2_2_1a_capture_smoke_target.json
          elif [ "$CAPTURE_MODE" = "approved_batch" ]; then
            python scripts/validate_phase2_2_1a_replacement.py --mode approved_batch --input data/phase2_2_1a_replacement_candidates.jsonl
          else
            echo "Unsupported capture mode" >&2; exit 2
          fi
      - name: Capture Desktop 1440 and Mobile 390 with normal browser access
        id: capture
        run: |
          if [ "$CAPTURE_MODE" = "smoke" ]; then INPUT=data/phase2_2_1a_capture_smoke_target.json; else INPUT=data/phase2_2_1a_replacement_candidates.jsonl; fi
          python scripts/capture_phase2_2_1a_replacements.py \
            --input "$INPUT" --mode "$CAPTURE_MODE" \
            --output artifacts/phase2_2_1a_replacement_capture \
            --run-id "$GITHUB_RUN_ID" --artifact-name "$CAPTURE_ARTIFACT_NAME" \
            --retention-days "$CAPTURE_RETENTION_DAYS"
      - name: Require manifest and at least one image before artifact upload
        if: always()
        run: |
          test -s artifacts/phase2_2_1a_replacement_capture/capture_manifest.json
          test -s artifacts/phase2_2_1a_replacement_capture/manifest.sha256
          find artifacts/phase2_2_1a_replacement_capture -type f \( -name '*.png' \) -print -quit | grep -q .
      - name: Upload temporary evidence package for durable-archive ingestion
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT_NAME }}
          path: artifacts/phase2_2_1a_replacement_capture/
          retention-days: ${{ env.CAPTURE_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Write artifact trace receipt
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={"artifact_name":os.environ["CAPTURE_ARTIFACT_NAME"],"run_id":os.environ["GITHUB_RUN_ID"],"artifact_id":os.environ["ARTIFACT_ID"],"artifact_digest":os.environ.get("ARTIFACT_DIGEST"),"artifact_url":os.environ.get("ARTIFACT_URL"),"retention_days":int(os.environ["CAPTURE_RETENTION_DAYS"]),"classification":"TEMPORARY_GITHUB_ACTIONS_ARTIFACT_NOT_DURABLE_ARCHIVE","durable_archive_ingestion_required":True}
          Path("artifacts/phase2_2_1a_artifact_receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write("## Replacement capture artifact\n\n```json\n"+json.dumps(receipt,indent=2)+"\n```\n")
          PY
      - name: Upload temporary artifact trace receipt
        if: always() && steps.upload.outputs.artifact-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase2-2-1a-artifact-receipt-${{ github.run_id }}
          path: artifacts/phase2_2_1a_artifact_receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Assert primary artifact identity and digest were emitted
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
