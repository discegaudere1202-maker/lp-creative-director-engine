name: Landscape Universe MLIT Count Probe

on:
  push:
    branches:
      - task/landscape-universe-24070
    paths:
      - 'scripts/lead_universe/probe_mlit_counts.py'
      - '.github/workflows/landscape_universe_count_probe.yml'
  workflow_dispatch:

jobs:
  count-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/lead_universe/probe_mlit_counts.py
