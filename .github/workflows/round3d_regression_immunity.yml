name: Round 3D Regression Immunity

run-name: Round 3D regression immunity · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "src/lp_engine/quality_invariants.py"
      - "tests/test_round3d_regression_immunity.py"
      - "scripts/run_round3d_regression_immunity.py"
      - ".github/workflows/round3d_regression_immunity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-immunity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and browser
        run: |
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Diff whitespace check
        run: git diff --check
      - name: Run Round 3D-I registry and regression suite
        run: python -X utf8 scripts/run_round3d_regression_immunity.py
      - name: Assert Round 3D-I artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/round3d_regression_immunity')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          checks = json.loads((root / 'd01_d17_results.json').read_text(encoding='utf-8'))
          corrected = json.loads((root / 'corrected_fixture_result.json').read_text(encoding='utf-8'))
          shadow = json.loads((root / 'shadow_validation_report.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'PASS'
          assert checks['status'] == 'PASS' and len(checks['tests']) == 17
          assert summary['known_defect_escape_rate'] == 0.0
          assert corrected['artifact_state'] == 'VALID'
          assert corrected['rendered']['status'] == 'PASS'
          assert shadow['known_failure_detected'] is True
          for width in (320, 360, 375, 390, 430, 768, 1024, 1280, 1440):
              assert (root / 'viewport_evidence' / f'corrected_{width}.png').is_file()
          for name in ('registry_snapshot.json', 'active_seed_invariants.json', 'nagi_failure_memory.json',
                       'negative_example.json', 'nagi_regression_fixture.json', 'case_decision_and_reopen_evidence.json',
                       'selective_revalidation_evidence.json', 'observability_sample.json', 'background_strategy_schema.json'):
              assert (root / name).is_file(), name
          PY
      - name: Upload Round 3D-I regression immunity package
        uses: actions/upload-artifact@v4
        with:
          name: round3d-regression-immunity-${{ github.sha }}
          path: artifacts/round3d_regression_immunity
          if-no-files-found: error
          compression-level: 6
